openapi: 3.1.0
info:
    title: AssemblyAI Dictation API
    description: Short-form dictation that returns send-ready cleaned-up text together with the verbatim transcript, in a single HTTP call.
    version: 1.0.0
servers:
    - url: https://dictation.assemblyai.com
      description: Global (default — routes to nearest region)
    - url: https://dictation.us.assemblyai.com
      description: US data residency (us-east-1, us-east-2, us-west-1, us-west-2)
    - url: https://dictation.eu.assemblyai.com
      description: EU data residency (eu-central-1, eu-north-1, eu-south-1, eu-south-2, eu-west-1, eu-west-3)
security:
    - ApiKey: []
paths:
    /v1/transcribe/live:
        post:
            summary: Transcribe dictated audio
            description: 'Send a spoken utterance and receive text ready to send, together with

                the verbatim transcript. Audio must be at most 120 seconds. For a

                finished recording of up to 20 minutes, or compressed audio, use

                [`/v1/transcribe`](/api-reference/dictation-api/transcribe).


                Cleanup runs by default. With no configuration, filler comes out,

                self-corrections resolve to what the speaker landed on, and punctuation

                and capitalization are applied. Set `llm_instruction` to ask for a

                different shape instead, such as a bulleted task list or a clinical

                note. The verbatim transcript is always returned in `text` alongside

                the cleaned-up text in `llm_response`.


                The body is `multipart/form-data` with two parts, and the `config` part

                must arrive **before** the `audio` part. The server begins transcribing

                the audio as it arrives and cannot start without the config, so a body

                whose audio comes first, or that has no config part at all, is rejected

                with `400`. Send `{}` when you have no options to set.


                Because the server reads the body as it arrives, you can open the

                request while the user is still speaking and upload the audio as it is

                captured, so the upload overlaps the recording instead of following

                it. See

                [Uploading while recording](/dictation/uploading-while-recording).


                This endpoint is also served at `/v1/transcribe/stream`, the path it

                shipped under. There is no unversioned alias.


                <Note>Dictation is a separate service from Sync, Pre-recorded, and

                Streaming STT, with its own hostname (`dictation.assemblyai.com`) and

                its own request shape. The Python SDK wraps it as `DictationTranscriber`

                in every other language, call it over HTTP. See the

                [Dictation quickstart](/dictation) for full guidance.</Note>

'
            operationId: transcribeDictation
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required:
                                - config
                                - audio
                            properties:
                                config:
                                    type: object
                                    additionalProperties: false
                                    description: Transcription and rewrite configuration. Must be the first part, ahead of `audio`. Send an empty object (`{}`) to transcribe with defaults, including the default rewrite. Only the fields below are accepted. An unknown field is rejected with a `400`.
                                    properties:
                                        sample_rate:
                                            type: integer
                                            description: Source sample rate in Hz, for example `16000`. Required when `audio` is `audio/pcm`. Ignored for WAV, which carries its sample rate in the file header.
                                        channels:
                                            type: integer
                                            description: Number of audio channels. Required when `audio` is `audio/pcm`. Ignored for WAV.
                                        language_codes:
                                            type: array
                                            items:
                                                type: string
                                                enum:
                                                    - en
                                                    - es
                                                    - de
                                                    - fr
                                                    - it
                                                    - pt
                                                    - tr
                                                    - nl
                                                    - sv
                                                    - 'no'
                                                    - da
                                                    - fi
                                                    - hi
                                                    - vi
                                                    - ar
                                                    - he
                                                    - ja
                                                    - ur
                                                    - zh
                                                    - ko
                                                    - ca
                                                    - gl
                                                    - ru
                                                    - ro
                                                    - et
                                                    - fa
                                                    - yue
                                                    - af
                                                    - mr
                                                    - zu
                                                    - xh
                                                    - nn
                                            description: Language or languages of the audio, as ISO language codes. A code outside this set is rejected with a `400`. When omitted, no language steering is applied.
                                        stt_prompt:
                                            type: string
                                            maxLength: 6000
                                            description: 'Context for the transcription: a description of what the audio is about, such as "A doctor dictating a patient visit note." It describes the situation rather than instructing the model, and is prepended to the base transcription prompt, which always applies. Also accepted as `prompt`; send one or the other, or the request is rejected with `400`.'
                                        keyterms_prompt:
                                            type: array
                                            maxItems: 100
                                            items:
                                                type: string
                                            description: Terms to bias transcription toward, such as names or jargon. Maximum 100 terms and 8000 characters in total. The legacy names `keyterms` and `word_boost` are also accepted; send only one of the three, or the request is rejected with `400`.
                                        llm_instruction:
                                            type: string
                                            description: 'Plain-English description of the shape you want the text in, which replaces the default cleanup task. Describe only the transformation: rules about output format, refusing to answer the text, and handling clean input are enforced automatically. Omitting the field, or setting it to `null`, keeps the default cleanup task, which removes filler, resolves self-corrections, and applies punctuation and capitalization.'
                                        rewrite_mode:
                                            type: string
                                            enum:
                                                - fast
                                                - smart
                                            default: fast
                                            description: Model tier that runs the rewrite. `fast`, the default, has the lowest latency. `smart` follows detailed formatting instructions more reliably, but has higher latency. Any other value is rejected with `400`.
                                audio:
                                    type: string
                                    format: binary
                                    description: Audio bytes, at most 120 seconds. Set the part's Content-Type to `audio/wav` for WAV or `audio/pcm` for raw 16-bit PCM. Compressed formats (MP3, M4A, FLAC, OGG, WebM) are rejected with `415`. The part may be uploaded in chunks as the audio is captured.
                                    contentMediaType: audio/wav
                        encoding:
                            config:
                                contentType: application/json
                            audio:
                                contentType: audio/wav, audio/pcm
            responses:
                '200':
                    description: 'Transcription completed. The rewrite is best-effort: a failed rewrite still returns `200` with the transcription, `llm_response` set to `null`, and `llm_error` set. Fall back to `text` in that case, and never treat a non-`null` `llm_error` as a failed request.'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DictationResponse'
                            example:
                                text: Um, patient presents with, uh, a persistent cough for about two weeks.
                                words:
                                    - text: Um
                                      confidence: 0.82
                                    - text: patient
                                      confidence: 0.97
                                    - text: presents
                                      confidence: 0.96
                                confidence: 0.94
                                llm_response: Patient presents with a persistent cough for about two weeks.
                                llm_error: null
                                audio_duration_ms: 5120
                                session_id: eb92c4ff-4bbb-429f-9b99-7279d7fe738f
                                request_time_ms: 812.4
                                sync_time_ms: 430.1
                                auth_time_ms: 24.6
                '400':
                    description: 'A malformed request body, or a Dictation-specific `config` field that fails validation, uses the `error`/`error_code` shape: a missing or empty `audio` part, a missing `config` part or one sent after `audio`, or `config` that is not valid JSON. A transcription `config` field that fails validation, including an unknown field, uses the `status`/`title`/`detail` shape instead.'
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ErrorResponse'
                                    - $ref: '#/components/schemas/DetailErrorResponse'
                '401':
                    description: Missing `Authorization` header, or an invalid API key.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DetailErrorResponse'
                            example:
                                status: 401
                                title: Unauthorized
                                detail: Invalid API key
                '413':
                    description: 'The audio passed 120 seconds or the size cap (`error_code: "audio_too_large"`). On a chunked upload this arrives mid-request, as soon as the cap is passed.'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '415':
                    description: The `audio` part is not `audio/wav` or `audio/pcm`. Compressed formats cannot be decoded incrementally; the `detail` points to the buffered `/v1/transcribe` endpoint for those.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DetailErrorResponse'
                '429':
                    description: Rate limited. Back off and retry.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DetailErrorResponse'
                '502':
                    description: 'Transcription upstream unavailable (`error_code: "upstream_error"`). Retry once, then surface an error.'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '503':
                    description: 'Server at capacity (`error_code: "capacity_exceeded"`). Back off and retry; no `Retry-After` header is sent.'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '504':
                    description: 'Transcription upstream timed out, the upload went silent for too long, or the request ran past its overall limit (`error_code: "upstream_timeout"`). Retry once, then surface an error.'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    /v1/transcribe:
        post:
            summary: Transcribe recorded audio
            description: 'Send a complete recording and receive text ready to send, together with

                the verbatim transcript. Audio must be between 80 ms and 20 minutes,

                and at most 256 MB.


                This endpoint takes audio you already hold in full. The server reads

                the whole body before it starts transcribing, so the `config` part can

                come before or after `audio`, and can be left out to use the defaults.

                Besides WAV and raw PCM, it accepts compressed audio: AAC, MP3, M4A,

                Ogg/Opus, FLAC, and WebM.


                For audio that is still being recorded, use

                [`/v1/transcribe/live`](/api-reference/dictation-api/transcribe-live)

                instead. It uploads while the user speaks and accepts up to 120 seconds

                of WAV or raw PCM. The SDKs use `/v1/transcribe/live`, so this endpoint

                is called over HTTP.


                This endpoint is also served at `/transcribe`, without the version

                prefix.

'
            operationId: transcribeDictationRecording
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required:
                                - audio
                            properties:
                                config:
                                    type: object
                                    additionalProperties: false
                                    description: Transcription and rewrite configuration. Optional; when omitted, the audio is transcribed with defaults, including the default rewrite. Only the fields below are accepted. An unknown field is rejected with a `400`.
                                    properties:
                                        sample_rate:
                                            type: integer
                                            description: Source sample rate in Hz, for example `16000`. Required when `audio` is `audio/pcm`. Not needed for WAV or compressed formats, which carry it in the file.
                                        channels:
                                            type: integer
                                            description: Number of audio channels. Required when `audio` is `audio/pcm`. Not needed for WAV or compressed formats.
                                        language_codes:
                                            type: array
                                            items:
                                                type: string
                                                enum:
                                                    - en
                                                    - es
                                                    - de
                                                    - fr
                                                    - it
                                                    - pt
                                                    - tr
                                                    - nl
                                                    - sv
                                                    - 'no'
                                                    - da
                                                    - fi
                                                    - hi
                                                    - vi
                                                    - ar
                                                    - he
                                                    - ja
                                                    - ur
                                                    - zh
                                                    - ko
                                                    - ca
                                                    - gl
                                                    - ru
                                                    - ro
                                                    - et
                                                    - fa
                                                    - yue
                                                    - af
                                                    - mr
                                                    - zu
                                                    - xh
                                                    - nn
                                            description: Language or languages of the audio, as ISO language codes. A code outside this set is rejected with a `400`. When omitted, no language steering is applied.
                                        stt_prompt:
                                            type: string
                                            maxLength: 6000
                                            description: 'Context for the transcription: a description of what the audio is about, such as "A doctor dictating a patient visit note." It describes the situation rather than instructing the model, and is prepended to the base transcription prompt, which always applies. Also accepted as `prompt`; send one or the other, or the request is rejected with `400`.'
                                        keyterms_prompt:
                                            type: array
                                            maxItems: 100
                                            items:
                                                type: string
                                            description: Terms to bias transcription toward, such as names or jargon. Maximum 100 terms and 8000 characters in total. The legacy names `keyterms` and `word_boost` are also accepted; send only one of the three, or the request is rejected with `400`.
                                        llm_instruction:
                                            type: string
                                            description: 'Plain-English description of the shape you want the text in, which replaces the default cleanup task. Describe only the transformation: rules about output format, refusing to answer the text, and handling clean input are enforced automatically. Omitting the field, or setting it to `null`, keeps the default cleanup task, which removes filler, resolves self-corrections, and applies punctuation and capitalization.'
                                        rewrite_mode:
                                            type: string
                                            enum:
                                                - fast
                                                - smart
                                            default: fast
                                            description: Model tier that runs the rewrite. `fast`, the default, has the lowest latency. `smart` follows detailed formatting instructions more reliably, but has higher latency. Any other value is rejected with `400`.
                                audio:
                                    type: string
                                    format: binary
                                    description: 'Audio bytes, between 80 ms and 20 minutes and at most 256 MB. Set the part''s Content-Type to the format: `audio/wav`, `audio/pcm` (raw 16-bit PCM), `audio/aac`, `audio/mpeg` (MP3), `audio/mp4` (M4A), `audio/ogg` (Ogg/Opus), `audio/flac`, or `audio/webm`.'
                                    contentMediaType: audio/wav
                        encoding:
                            config:
                                contentType: application/json
                            audio:
                                contentType: audio/wav, audio/pcm, audio/aac, audio/mpeg, audio/mp4, audio/ogg, audio/flac, audio/webm
            responses:
                '200':
                    description: 'Transcription completed. The rewrite is best-effort: a failed rewrite still returns `200` with the transcription, `llm_response` set to `null`, and `llm_error` set. Fall back to `text` in that case, and never treat a non-`null` `llm_error` as a failed request.'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DictationResponse'
                '400':
                    description: 'A malformed request body, or a Dictation-specific `config` field that fails validation, uses the `error`/`error_code` shape: a missing or empty `audio` part, an `audio` part over 256 MB, or `config` that is not valid JSON. Audio shorter than 80 ms, audio that cannot be decoded, and a transcription `config` field that fails validation, including an unknown field, use the `status`/`title`/`detail` shape instead.'
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ErrorResponse'
                                    - $ref: '#/components/schemas/DetailErrorResponse'
                '401':
                    description: Missing `Authorization` header, or an invalid API key.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DetailErrorResponse'
                '413':
                    description: 'The audio is longer than 20 minutes (`title: "Audio Too Large"`).'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DetailErrorResponse'
                '415':
                    description: The `audio` part's Content-Type is not a supported format.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DetailErrorResponse'
                '429':
                    description: Rate limited. Back off and retry.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DetailErrorResponse'
                '502':
                    description: 'Transcription upstream unavailable (`error_code: "upstream_error"`). Retry once, then surface an error.'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '503':
                    description: Server at capacity. Back off and retry.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ErrorResponse'
                                    - $ref: '#/components/schemas/DetailErrorResponse'
                '504':
                    description: Transcription timed out. Retry once, then surface an error.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ErrorResponse'
                                    - $ref: '#/components/schemas/DetailErrorResponse'
    /warm:
        get:
            summary: Pre-warm the connection
            description: >-
                Open a connection before sending audio. No authentication is required. Call shortly before transcription using the same HTTP client and host so the transcription can reuse the connection pool. The response body is only an acknowledgement.
            externalDocs:
                url: https://www.assemblyai.com/docs/dictation/connection-pre-warming
            operationId: warm
            security: []
            responses:
                '200':
                    description: Connection is ready.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - warm
                                properties:
                                    warm:
                                        type: string
                                        example: toasty
                            example:
                                warm: toasty
components:
    schemas:
        DictationResponse:
            type: object
            required:
                - text
                - words
                - confidence
                - audio_duration_ms
                - session_id
            properties:
                text:
                    type: string
                    description: The verbatim transcript. Never altered by the LLM.
                words:
                    type: array
                    items:
                        $ref: '#/components/schemas/Word'
                    description: Per-word transcript objects.
                confidence:
                    type: number
                    format: float
                    description: Overall transcription confidence (0–1).
                llm_response:
                    type: string
                    description: The rewritten text, or `null` when the rewrite failed. Fall back to `text` when it is `null`.
                llm_error:
                    type: string
                    enum:
                        - timeout
                        - error
                    description: Set when the rewrite failed. `timeout` means the rewrite passed its internal deadline. `null` on success.
                audio_duration_ms:
                    type: number
                    description: Duration of the submitted audio in milliseconds.
                session_id:
                    type: string
                    format: uuid
                    description: Server-generated request identifier. Include it when reporting problems.
                request_time_ms:
                    type: number
                    format: float
                    description: Total server-side processing time in milliseconds.
                auth_time_ms:
                    type: number
                    format: float
                    description: Time in milliseconds spent authenticating the request, included in `request_time_ms`.
                sync_time_ms:
                    type: number
                    format: float
                    description: The transcription portion of `request_time_ms`, in milliseconds.
        ErrorResponse:
            type: object
            properties:
                error:
                    type: string
                    description: Human-readable error description.
                error_code:
                    type: string
                    description: Machine-readable error code, such as `bad_request`, `audio_too_large`, `capacity_exceeded`, `upstream_error`, or `upstream_timeout`.
        DetailErrorResponse:
            type: object
            description: The shape used by auth failures (`401`), rate limiting (`429`), and errors from the transcription step, including transcription `config` validation failures (`400`) and unsupported audio formats (`415`).
            properties:
                status:
                    type: integer
                title:
                    type: string
                detail:
                    type: string
                    description: Human-readable error description.
        Word:
            type: object
            required:
                - text
                - confidence
            properties:
                text:
                    type: string
                confidence:
                    type: number
                    format: float
    securitySchemes:
        ApiKey:
            type: apiKey
            in: header
            name: Authorization
            description: Your AssemblyAI API key, sent as the raw key with no `Bearer` prefix. A missing header or an invalid key returns `401`.
