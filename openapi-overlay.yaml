# OpenAPI Overlay for AssemblyAIDictationAPI
# This file allows you to make manual corrections to the OpenAPI specification
# without modifying the original file. The bootstrapper will apply this overlay
# on top of the cleaned openapi.yaml file.
#
# For overlay syntax, see: https://github.com/OAI/Overlay-Specification
#
# Update actions recursively merge objects and concatenate arrays. To replace
# an entire schema, remove the schema in one action and add it to
# $.components.schemas in the next action.

overlay: 1.0.0
info:
  title: AssemblyAIDictationAPI API Overlay
  version: 1.0.0

# Example actions (uncomment and modify as needed):
# actions:
#   # Make a field required
#   - target: "$.components.schemas.User"
#     update:
#       required:
#         - user_id
#         - email
#
#   # Add a missing property
#   - target: "$.components.schemas.Product"
#     update:
#       properties:
#         newField:
#           type: string
#           description: "A field that was missing in the original spec"
#
#   # Fix an incorrect type
#   - target: "$.components.schemas.Order.properties.total"
#     update:
#       type: number
#       format: double
#
#   # Remove a deprecated field
#   - target: "$.components.schemas.LegacyModel.properties.oldField"
#     remove: true

actions:
  # The generator ignores an encoding with multiple content types. Supply the
  # WAV default on the schema so typed audio parts do not fall back to text/plain.
  - target: "$.paths['/v1/transcribe/live'].post.requestBody.content['multipart/form-data'].schema.properties.audio"
    update:
      contentMediaType: audio/wav
  - target: "$.paths['/v1/transcribe'].post.requestBody.content['multipart/form-data'].schema.properties.audio"
    update:
      contentMediaType: audio/wav
  - target: "$.paths"
    update:
      /warm:
        get:
          summary: Pre-warm the connection
          description: >-
            Open a connection before sending audio. No authentication is required.
            Call shortly before transcription using the same HTTP client and host
            so the transcription can reuse the connection pool. The response body
            is only an acknowledgement.
          externalDocs:
            url: https://www.assemblyai.com/docs/dictation/connection-pre-warming
          operationId: warm
          security: []
          responses:
            '200':
              description: Connection is ready.
              content:
                application/json:
                  schema:
                    type: object
                    required:
                      - warm
                    properties:
                      warm:
                        type: string
                        example: toasty
                  example:
                    warm: toasty
